name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
 
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore Investimentos.slnx
    - name: Build
      run: dotnet build Investimentos.slnx --no-restore
    - name: Test
      run: dotnet test Investimentos.slnx --no-build --verbosity normal